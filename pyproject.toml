[project]
name = "eyocean-radio-frequency"
version = "0.1.1"
description = "Home Assistant RF command buttons for EYOCEAN desk lamps"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant==2026.10.4",
    "rf-protocols==4.3.0",
    "pytest-homeassistant-custom-component==0.13.375",
    "ruff==0.17.3",
    "prek>=0.5.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
