name: Tests and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check custom_components tests scripts
      - run: uv run --locked prek run --all-files
      - run: uv run --locked python scripts/package.py
