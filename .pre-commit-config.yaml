repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: Check uv lockfile
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
