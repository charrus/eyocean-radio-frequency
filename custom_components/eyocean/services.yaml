send_raw:
  name: Send raw RF waveform
  description: >-
    Administrator-only diagnostic transmission at 433.92 MHz OOK. Does not learn,
    pair, or confirm appliance state. Observe local RF duty-cycle limits.
  fields:
    transmitter:
      name: RF transmitter
      description: Native RF transmitter entity or its entity-registry UUID.
      required: true
      selector:
        entity:
          domain: radio_frequency
    timings:
      name: Raw timings
      description: >-
        List of 2–4096 alternating positive marks and negative spaces in microseconds.
        Start positive and end negative; each duration must be 1–500000 microseconds.
        Total encoded duration including repeats must not exceed five seconds.
      required: true
      example: [250, -750, 750, -250, 250, -12000]
      selector:
        object:
    repeats:
      name: Total transmissions
      description: Total transmissions, not additional repeats. Defaults to one.
      default: 1
      selector:
        number:
          min: 1
          max: 20
          mode: box
